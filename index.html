<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Gibby's Christmas Hub</title>
<link href="https://fonts.googleapis.com/css2?family=Mountains+of+Christmas:wght@700&family=Nunito:wght@600;800&display=swap" rel="stylesheet">
<style>
:root{--bg2:#06201a;--red:#c0242f;--red2:#8e1620;--green:#1f7a4d;--cream:#fff6e5;--gold:#ffd25a;--ink:#2a1a14}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg2);color:var(--cream);font:800 26px/1.35 Nunito,Arial,sans-serif;overflow-x:hidden}
#snow{position:fixed;inset:0;pointer-events:none;z-index:4}
main{position:relative;z-index:2;max-width:1780px;margin:0 auto;padding:84px 40px 30px}
h2{font-family:"Mountains of Christmas",Georgia,serif;margin:0;font-size:62px;color:var(--gold);animation:gl 2.5s ease-in-out infinite alternate}
@keyframes gl{from{text-shadow:0 3px 10px #000,0 0 8px rgba(255,210,90,.3)}to{text-shadow:0 3px 10px #000,0 0 40px #ffd25a}}
.view{display:none}.view.on{display:block;animation:vin .5s ease-out}
@keyframes vin{from{opacity:0;transform:translateY(24px) scale(.98)}to{opacity:1;transform:none}}
.top{display:flex;align-items:center;gap:24px;margin-bottom:24px}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,button:focus{outline:6px solid var(--gold);outline-offset:4px;transform:scale(1.04)}
.back{background:linear-gradient(var(--cream),#f3dfb8);color:var(--ink);border:0;border-radius:16px;padding:10px 26px;box-shadow:0 5px 0 #b99a62,0 8px 20px #0008}
/* top lights + ornaments */
.lights{position:fixed;left:0;right:0;top:0;height:26px;z-index:6;pointer-events:none;background:radial-gradient(circle at 12px 12px,#ff5a5a 7px,transparent 9px) 0 0/96px 26px repeat-x,radial-gradient(circle at 12px 12px,#ffd54a 7px,transparent 9px) 32px 0/96px 26px repeat-x,radial-gradient(circle at 12px 12px,#5cff9a 7px,transparent 9px) 64px 0/96px 26px repeat-x,radial-gradient(circle at 12px 12px,#6fb7ff 7px,transparent 9px) 16px 0/96px 26px repeat-x;filter:drop-shadow(0 0 6px #fff8);animation:tw 1.6s ease-in-out infinite alternate}
.lights.b2{animation-delay:-.8s;top:2px;opacity:.7;transform:translateX(48px)}
@keyframes tw{from{opacity:.5}to{opacity:1}}
.orn{position:fixed;top:22px;z-index:6;pointer-events:none;width:2px;transform-origin:top center;animation:sw 3s ease-in-out infinite alternate}
.orn i{display:block;width:2px;background:#e8e2c8}
.orn b{display:block;width:30px;height:30px;margin-left:-14px;border-radius:50%;background:radial-gradient(circle at 30% 30%,rgba(255,255,255,.9),currentColor 60%);box-shadow:inset -6px -6px 10px rgba(0,0,0,.35),0 0 14px currentColor}
@keyframes sw{from{transform:rotate(-8deg)}to{transform:rotate(8deg)}}
/* santa */
#santa{position:fixed;top:8%;left:-380px;z-index:3;pointer-events:none;animation:fly 36s linear infinite 3s;filter:drop-shadow(0 0 22px #fffb)}
#santa img{height:140px;display:block;animation:bobS 1.6s ease-in-out infinite alternate}
#santa span{font-size:90px;display:block}
#santa:before{content:"✨ ⭐ ✨ ❄️ ✨";position:absolute;right:100%;top:50%;white-space:nowrap;font-size:28px;letter-spacing:10px;opacity:.85;animation:tw .5s infinite alternate}
@keyframes fly{0%{transform:translateX(0)}70%,100%{transform:translateX(calc(100vw + 760px))}}
@keyframes bobS{from{transform:translateY(-16px) rotate(-3deg)}to{transform:translateY(22px) rotate(3deg)}}
.shoot{position:fixed;top:14%;left:8%;width:220px;height:3px;background:linear-gradient(90deg,transparent,#fff);opacity:0;z-index:0;pointer-events:none;animation:sh 11s ease-out infinite}
@keyframes sh{0%{opacity:0;transform:translate(0,0) rotate(25deg)}2%{opacity:1}9%{opacity:0;transform:translate(700px,330px) rotate(25deg)}100%{opacity:0}}
#aur{position:fixed;left:-10%;top:3%;width:120%;height:40%;z-index:0;pointer-events:none;background:radial-gradient(ellipse at 30% 50%,rgba(60,255,154,.45),transparent 60%),radial-gradient(ellipse at 70% 50%,rgba(170,120,255,.4),transparent 60%);animation:aur 12s ease-in-out infinite alternate;filter:blur(8px)}
@keyframes aur{from{transform:translateX(-6%) scaleY(.85)}to{transform:translateX(6%) scaleY(1.25)}}
#bg .star{animation:tw 2s infinite alternate}
.fl{position:fixed;bottom:-60px;z-index:1;pointer-events:none;opacity:.7;animation:up linear infinite}
@keyframes up{to{transform:translateY(-115vh) rotate(60deg)}}
.cf{position:fixed;top:-50px;z-index:900;pointer-events:none;animation:dn linear forwards}
@keyframes dn{to{transform:translateY(112vh) rotate(540deg)}}
/* village */
#scene{position:fixed;left:0;top:0;overflow:hidden;z-index:2}
#gnd{position:absolute;left:0;right:0;top:30%;bottom:0;background:linear-gradient(#f6fbff,#dcecf8 22%,#b4cfe6 70%,#9dbfdc)}#gnd:before{content:"";position:absolute;left:0;right:0;top:-2.3em;height:2.5em;background:radial-gradient(circle at 50% 100%,#f6fbff 1.7em,transparent 1.8em) 0 0/3.4em 2.5em repeat-x}#gnd:after{content:"";position:absolute;left:-20%;right:-20%;top:-5%;height:16%;background:radial-gradient(ellipse,rgba(255,255,255,.6),transparent 70%);filter:blur(8px);animation:fog 22s ease-in-out infinite alternate}@keyframes fog{to{transform:translateX(12%)}}#fg{position:absolute;left:0;right:0;bottom:0;height:5%;z-index:1000;pointer-events:none;background:linear-gradient(transparent,#fff 55%);border-radius:50% 50% 0 0/100% 100% 0 0}#vig{position:fixed;inset:0;z-index:5;pointer-events:none;background:radial-gradient(ellipse at 50% 45%,transparent 55%,rgba(0,10,25,.5))}
.spk{position:absolute;animation:tw 1.4s infinite alternate;font-size:2em}
.hud{position:absolute;left:41%;width:18%;top:6%;text-align:center;z-index:300}
.ttl{font:700 3em "Mountains of Christmas",Georgia,serif;line-height:1;white-space:nowrap;background:linear-gradient(90deg,#ffd25a,#fff,#ff7a7a,#fff,#ffd25a);background-size:300% 100%;-webkit-background-clip:text;background-clip:text;color:transparent;animation:shim 5s linear infinite;filter:drop-shadow(0 3px 6px #000)}
@keyframes shim{to{background-position:-300% 0}}
.cdw{display:flex;gap:.5em;justify-content:center;margin-top:.5em;font-size:1.9em}
.cdw div{background:linear-gradient(var(--cream),#f5e2bd);color:var(--red);border:.12em solid var(--gold);border-radius:.4em;padding:.25em .6em;text-align:center;min-width:2.5em;line-height:1;box-shadow:0 .2em .5em #0007}
.cdw small{display:block;font-size:.38em;color:var(--ink);margin-top:.2em}
.cdw div:last-child{animation:pls 1s ease-in-out infinite}
@keyframes pls{50%{transform:scale(1.08)}}
.clk{font-size:1.4em;margin-top:.2em;text-shadow:0 2px 8px #000}
#prompt{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);z-index:400;background:rgba(120,15,25,.92);border:3px solid var(--gold);color:var(--cream);font-size:28px;padding:.25em 1.1em;border-radius:2em;white-space:nowrap;box-shadow:0 0 24px rgba(255,210,90,.5);animation:pls 2s infinite}
.b{position:absolute;border:0;background:none;padding:0;text-align:center;color:inherit;transition:transform .2s}
.b:focus,.b:focus-visible{outline:0;transform:none}
.b svg{transition:transform .2s,filter .2s}
.b.near svg{filter:drop-shadow(0 0 1.2em #ffd24a);transform:scale(1.07);transform-origin:50% 100%;animation:hop .7s ease-in-out infinite alternate}
@keyframes hop{to{transform:scale(1.09)}}
.sign{display:inline-block;margin-top:.5em;background:var(--cream);color:var(--ink);padding:.1em .8em;border-radius:.5em;font-size:1.7em;line-height:1.3}
.b.near .sign{background:var(--gold)}
.dec{position:absolute;line-height:1;transform:translate(-50%,-100%)}
.sway{transform-origin:50% 100%;animation:swy 4s ease-in-out infinite alternate}
@keyframes swy{from{transform:rotate(-3deg)}to{transform:rotate(3deg)}}
.idle{display:block;animation:idl 1.6s ease-in-out infinite alternate}
@keyframes idl{to{transform:translateY(-.25em) rotate(4deg)}}
.lt{animation:tw2 1.2s steps(1) infinite}@keyframes tw2{0%{opacity:.3}50%{opacity:1}}
.wn{animation:wn 3.2s ease-in-out infinite}@keyframes wn{0%,100%{opacity:1}40%{opacity:.7}50%{opacity:1}}
.sm{transform-box:fill-box;transform-origin:center;animation:smk 4s ease-out infinite}.s2{animation-delay:2s}
@keyframes smk{0%{transform:translate(0,0) scale(.6);opacity:.8}100%{transform:translate(14px,-44px) scale(2.2);opacity:0}}
.st{filter:drop-shadow(0 0 8px #fff3a0);animation:pls 1.5s infinite;transform-box:fill-box;transform-origin:center}
.flip,.bob{display:block;transform-origin:50% 100%}
.bob.walk{animation:bob .36s ease-in-out infinite alternate}
@keyframes bob{from{transform:translateY(0) rotate(-3deg)}to{transform:translateY(-.1em) rotate(3deg)}}
.pole{position:absolute;width:2em;height:16em;border-radius:1em;background:repeating-linear-gradient(45deg,#c0242f 0 1em,#fff 1em 2em);box-shadow:0 0 18px #fff5}
.pole i{position:absolute;bottom:100%;left:50%;transform:translateX(-50%);margin-bottom:.3em;white-space:nowrap;background:#fff;color:var(--red);font-style:normal;padding:.1em .6em;border-radius:.4em;font-size:1.6em}
.lamp{position:absolute;width:.6em;height:9em;background:repeating-linear-gradient(45deg,#c0242f 0 .6em,#fff .6em 1.2em);border-radius:.3em;transform:translate(-50%,-100%)}
.lamp:after{content:"";position:absolute;left:50%;top:-.8em;width:2em;height:2em;margin-left:-1em;border-radius:50%;background:#ffe9a0;box-shadow:0 0 2em 1em rgba(255,220,120,.6);animation:pls 2s infinite}
/* pages */
.view:not(#home).on{background:linear-gradient(rgba(6,32,24,.72),rgba(6,32,24,.55));backdrop-filter:blur(6px);border:4px solid rgba(255,210,90,.55);border-radius:34px;padding:26px 34px 34px;box-shadow:0 0 60px rgba(0,0,0,.6),inset 0 0 40px rgba(255,210,90,.08)}
.top h2{background:linear-gradient(#d82e3a,#8e1620);padding:.05em .7em;border:4px solid var(--gold);border-radius:.3em;box-shadow:0 6px 18px #000a;position:relative}
.tiles{display:grid;grid-template-columns:repeat(4,1fr);gap:24px}
.tile{position:relative;overflow:hidden;border:6px solid var(--cream);border-radius:24px;padding:30px 10px;font-size:30px;background:linear-gradient(160deg,#e03a46,#9a1824);box-shadow:inset 0 0 0 6px rgba(255,255,255,.12),0 8px 22px #0008}
.tile:nth-child(even){background:linear-gradient(160deg,#2a9a62,#145a38)}
.tile span{display:block;font-size:76px;line-height:1.1}
.tile:after,.opt:after,.item:after{content:"";position:absolute;top:0;left:-80%;width:50%;height:100%;background:linear-gradient(100deg,transparent,rgba(255,255,255,.45),transparent);transform:skewX(-20deg)}
.tile:focus:after,.opt:focus:after,.item:focus:after{animation:swp .9s}
@keyframes swp{to{left:140%}}
.row{display:grid;grid-template-columns:420px 1fr;gap:30px}
.list{display:flex;flex-direction:column;gap:12px}
.item,.opt{position:relative;overflow:hidden;background:linear-gradient(160deg,#d82e3a,#971824);border:4px solid var(--cream);border-radius:16px;padding:12px 18px;text-align:left;box-shadow:0 5px 14px #0007}
.item:focus,.opt:focus{box-shadow:0 0 30px var(--gold)}
.panel{background:linear-gradient(var(--cream),var(--cream)) padding-box,repeating-linear-gradient(45deg,#c0242f 0 14px,#fff 14px 28px) border-box;border:10px solid transparent;color:var(--ink);border-radius:24px;padding:26px 34px;min-height:380px;box-shadow:0 10px 40px #000a}
.panel h3{font-family:"Mountains of Christmas",Georgia,serif;font-size:50px;margin:0 0 8px;color:var(--red)}
.panel p{margin:8px 0;font-weight:600}
.frame{width:100%;aspect-ratio:16/9;object-fit:contain;border:8px solid var(--gold);border-radius:20px;background:#000;box-shadow:0 0 50px rgba(255,150,40,.5)}
.note{background:var(--cream);color:var(--ink);padding:22px;border-radius:18px;border:5px solid var(--gold)}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-top:20px}
.opt.ok{background:#1f9f55;animation:pls .4s}.opt.bad{background:#555}
.grid{display:grid;gap:14px}
.card{height:130px;font-size:64px;background:linear-gradient(160deg,#d82e3a,#971824);border:4px solid var(--cream);border-radius:14px;transition:transform .3s}
.card.up{background:var(--cream);transform:rotateY(360deg)}
.sq{height:150px;font-size:80px;background:#0b2f20;border:4px solid var(--cream);border-radius:14px}
.big{font-size:34px}
#music .row{grid-template-columns:minmax(300px,420px) 1fr;align-items:start}
#music .list{max-height:calc(100vh - 200px);overflow-y:auto;padding:6px 10px 6px 6px}
#mplayer{position:sticky;top:90px}
.np{margin:12px 0 0;font-size:28px}
.eq{display:inline-flex;gap:5px;align-items:flex-end;height:36px;margin-left:12px;vertical-align:middle}
.eq i{width:8px;background:var(--red);border-radius:3px;animation:eq .6s ease-in-out infinite alternate}
.eq i:nth-child(2){animation-delay:-.2s}.eq i:nth-child(3){animation-delay:-.4s}.eq i:nth-child(4){animation-delay:-.1s}
@keyframes eq{from{height:6px}to{height:36px}}
.rec{display:inline-block;animation:spn 8s linear infinite}@keyframes spn{to{transform:rotate(360deg)}}
@media (max-width:900px){#music .row{grid-template-columns:1fr}#mplayer{order:-1;top:84px;z-index:5}#music .list{max-height:42vh}.tiles{grid-template-columns:repeat(2,1fr)}.row{grid-template-columns:1fr}}
</style>
</head>
<body>
<audio id="bgm" src="gchbg.mp3" loop preload="auto"></audio>
<canvas id="snow"></canvas>
<div class="lights b2"></div><div class="lights"></div>
<div id="santa"><img src="santa.png" alt="Santa" onerror="this.outerHTML='<span>🎅🛷</span>'"></div>
<div class="shoot"></div><div class="shoot" style="top:6%;left:48%;animation-delay:5s"></div>
<svg id="bg" viewBox="0 0 1920 1080" preserveAspectRatio="xMidYMid slice" style="position:fixed;left:0;top:0;width:100%;height:100%;z-index:0">
<defs><linearGradient id="sk" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#040a20"/><stop offset=".5" stop-color="#1a3470"/><stop offset="1" stop-color="#5a8fb8"/></linearGradient>
<radialGradient id="mn"><stop offset="0" stop-color="#fffbe8"/><stop offset=".3" stop-color="#fffbe8" stop-opacity=".6"/><stop offset="1" stop-color="#fffbe8" stop-opacity="0"/></radialGradient></defs>
<rect width="1920" height="1080" fill="url(#sk)"/><g id="stars"></g>
<circle cx="1620" cy="190" r="190" fill="url(#mn)" opacity=".55"/><circle cx="1620" cy="190" r="62" fill="#fffbe8"/><circle cx="1600" cy="176" r="12" fill="#e6e0c4"/><circle cx="1640" cy="208" r="9" fill="#e6e0c4"/>
<path d="M0 760 Q300 680 600 740 T1200 730 T1920 720 V1080 H0Z" fill="#8fb4d3"/><g id="t1"></g>
<path d="M0 850 Q400 770 900 840 T1920 810 V1080 H0Z" fill="#d6e8f5"/><g id="t2"></g>
<path d="M0 960 Q500 905 1000 965 T1920 935 V1080 H0Z" fill="#c9deef"/></svg><div id="aur"></div>
<main>
<section class="view on" id="home">
<div id="scene"><div id="gnd"></div><div id="fg"></div><div class="hud"><div class="ttl">🎄 North Pole 🎄</div><div class="cdw"></div><div class="clk" id="clk"></div></div></div>
<div id="vig"></div>
</section>
<section class="view" id="yule"><div class="top"><button class="back" data-go="home">⬅ Home</button><h2>🔥 Yule Log</h2></div><div id="yuleBox"></div></section>
<section class="view" id="music"><div class="top"><button class="back" data-go="home">⬅ Home</button><h2>🎶 Christmas Music</h2></div><div id="musicBox"></div></section>
<section class="view" id="movies"><div class="top"><button class="back" data-go="home">⬅ Home</button><h2>🎬 Movie Night</h2></div><div class="row"><div class="list" id="movieList"></div><div class="panel" id="moviePanel"></div></div></section>
<section class="view" id="recipes"><div class="top"><button class="back" data-go="home">⬅ Home</button><h2>🍪 Holiday Recipes</h2></div><div class="row"><div class="list" id="recipeList"></div><div class="panel" id="recipePanel"></div></div></section>
<section class="view" id="games">
  <div class="top"><button class="back" id="gback">⬅ Back</button><h2>🎮 Games</h2></div>
  <div class="tiles" id="gmenu">
    <button class="tile" data-game="trivia"><span>🧠</span>Trivia</button>
    <button class="tile" data-game="scramble"><span>🔤</span>Word Scramble</button>
    <button class="tile" data-game="memory"><span>🃏</span>Memory Match</button>
    <button class="tile" data-game="color"><span>🎨</span>Color the Tree</button>
    <button class="tile" data-game="catch"><span>🎁</span>Catch the Gifts</button>
    <button class="tile" data-game="simon"><span>💡</span>Light Show</button>
    <button class="tile" data-game="hangman"><span>🎄</span>Guess the Word</button>
    <button class="tile" data-game="grinch"><span>🧌</span>Grinch Smash</button>
    <button class="tile" data-game="count"><span>🔢</span>Count the Gifts</button>
  </div>
  <div id="stage" style="display:none"></div>
</section>
<section class="view" id="quiz"><div class="top"><button class="back" data-go="home">⬅ Home</button><h2>😇 Naughty or Nice?</h2></div><div id="quizBox"></div></section>
<section class="view" id="facts"><div class="top"><button class="back" data-go="home">⬅ Home</button><h2>⭐ Fun Facts</h2></div>
  <div class="panel"><p class="big" id="factText"></p></div>
  <p><button class="tile" id="nextFact" style="padding:16px 40px">Next fact ➜</button></p></section>
</main>

<script>
/* ===== CONFIG: songs for the Music page. Put mp3 files next to this file and add a line for each ===== */
const CONFIG = {
  songs: [
    { title: 'Jingle Bell Rock - Bobby Helms', file: 'jbr.mp3' },
    { title: 'All I Want for Christmas Is You - Mariah Carey', file: 'aiwfc.mp3' }
  ]
};
const $ = s => document.querySelector(s);
const $$ = s => [...document.querySelectorAll(s)];
const shuffle = a => { a = [...a]; for (let i = a.length - 1; i > 0; i--) { const j = Math.random() * (i + 1) | 0; [a[i], a[j]] = [a[j], a[i]]; } return a; };
const esc = t => String(t).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const pr = { style: {} }, sc = $('#scene');
let current = 'home', snowOn = true;

/* ===== Celebration confetti ===== */
function confetti() {
  const E = ['🎁', '⭐', '❄️', '🎄', '🔔', '✨', '🍬'];
  for (let i = 0; i < 36; i++) {
    const c = document.createElement('div'); c.className = 'cf'; c.textContent = E[i % E.length];
    c.style.cssText = `left:${Math.random() * 100}%;font-size:${24 + Math.random() * 30}px;animation-duration:${2 + Math.random() * 2}s;animation-delay:${Math.random() * .6}s`;
    document.body.appendChild(c); setTimeout(() => c.remove(), 5000);
  }
}
/* ===== Floating emoji on inner pages ===== */
for (let i = 0; i < 12; i++) {
  const f = document.createElement('div'); f.className = 'fl'; f.textContent = ['❄️', '⭐', '🎁', '🔔', '🎄', '🍪'][i % 6];
  f.style.cssText = `left:${(i * 8.5 + Math.random() * 5) | 0}%;font-size:${26 + Math.random() * 28}px;animation-duration:${14 + Math.random() * 12}s;animation-delay:-${Math.random() * 20}s`;
  document.body.appendChild(f);
}
for (let i = 0; i < 16; i++) {
  const o = document.createElement('div'); o.className = 'orn';
  o.style.cssText = `left:${3 + i * 6 + Math.random() * 2}%;color:${['#e63946', '#f0c24b', '#3b82c4', '#2fbf71', '#b57cff'][i % 5]};animation-delay:-${(Math.random() * 3).toFixed(1)}s;animation-duration:${(2.4 + Math.random() * 2).toFixed(1)}s`;
  o.innerHTML = `<i style="height:${14 + Math.random() * 26 | 0}px"></i><b></b>`; document.body.appendChild(o);
}

/* ===== Views / navigation ===== */
function show(id) {
  if (id === 'snowtoggle') { snowOn = !snowOn; pr.textContent = snowOn ? 'Snow is ON ❄️' : 'Snow is OFF'; return; }
  $$('.view').forEach(v => v.classList.toggle('on', v.id === id));
  current = id; syncBgm(); pr.style.display = id === 'home' ? '' : 'none';
  $('#santa').style.opacity = id === 'home' ? 1 : .55;
  if (id === 'yule') {
    $('#yuleBox').innerHTML = '<video class="frame" src="yulelog.mp4" autoplay loop playsinline controls></video><p class="yerr" style="display:none">Could not load yulelog.mp4. Put it in the same folder as index.html.</p>';
    const v = $('#yuleBox video'); v.onerror = () => { $('#yuleBox .yerr').style.display = ''; }; v.play().catch(() => {});
  }
  if (id === 'music') buildMusic();
  if (id === 'quiz') startQuiz();
  if (id === 'facts') nextFact();
  if (id !== 'yule' && id !== 'music') { $('#yuleBox').innerHTML = ''; $('#musicBox').innerHTML = ''; }
  if (id !== 'games') closeStage(true);
  window.scrollTo(0, 0);
  if (id === 'home') { sizeScene(); focusHome(); return; }
  const pick = document.querySelector('.view.on .item, .view.on .tile, .view.on button'); pick && pick.focus();
}
function buildMusic() {
  const S = CONFIG.songs.filter(s => s.file || s.url);
  if (!S.length) { $('#musicBox').innerHTML = '<div class="note">Add songs to CONFIG at the top of index.html.</div>'; return; }

  if (!e.key.startsWith('Arrow')) return;

  e.preventDefault();
  const els = $$('.view.on button').filter(b => b.offsetParent), cur = document.activeElement;
  if (!els.includes(cur)) { els[0] && els[0].focus(); return; }
  const r = cur.getBoundingClientRect(), cx = r.left + r.width / 2, cy = r.top + r.height / 2;
  let best, bs = 1e9;
  els.forEach(b => {
    if (b === cur) return;
    const q = b.getBoundingClientRect(), x = q.left + q.width / 2 - cx, y = q.top + q.height / 2 - cy;
    const [m, o] = e.key === 'ArrowRight' ? [x, Math.abs(y)] : e.key === 'ArrowLeft' ? [-x, Math.abs(y)] : e.key === 'ArrowDown' ? [y, Math.abs(x)] : [-y, Math.abs(x)];

/* Villagers: each one wanders on its own, with pauses, varied speeds and glances */
function roam(d, size, x0, y0, o) {
  const flip = d.querySelector('.flip'), bob = d.querySelector('.bob');
  let cx = x0, cy = y0, left = false;
  const face = l => { if (!o.flip) return; left = l; flip.style.transform = l ? 'scaleX(-1)' : 'none'; };
  const rest = () => {
    const wait = Math.random() < .25 ? 4000 + Math.random() * 5000 : 1200 + Math.random() * 2500;
    if (Math.random() < .35) setTimeout(() => face(!left), wait * (.3 + Math.random() * .4));
    setTimeout(walk, wait);
  };
  const walk = () => {
    const hop = (Math.random() < .3 ? 1 : .4) * (Math.random() * 2 - 1) * o.hop;
    const tx = Math.max(o.x[0], Math.min(o.x[1], cx + hop)), ty = Math.max(o.y[0], Math.min(o.y[1], cy + (Math.random() * 2 - 1) * o.dy));
    const dx = tx - cx, dy = (ty - cy) * .5625, dist = Math.hypot(dx, dy);
    if (dist < 1.2) { rest(); return; }
    const dur = dist / (o.speed * (.8 + Math.random() * .4));
    if (Math.abs(dx) > .3) face(dx < 0);
    if (o.bob) { bob.style.animationDuration = (.3 + Math.random() * .12).toFixed(2) + 's'; bob.classList.add('walk'); }
    d.style.zIndex = Math.round(ty); d.style.transition = `transform ${dur.toFixed(2)}s linear`;
    cx = tx; cy = ty;
    d.style.transform = `translate(calc(-50% + ${(cx - x0) / size}em), calc(-100% + ${(cy - y0) * .5625 / size}em))`;
    setTimeout(() => { bob.classList.remove('walk'); rest(); }, dur * 1000);
  };
  setTimeout(walk, Math.random() * 3000);
}
