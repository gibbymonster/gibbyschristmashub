<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Gibby's Christmas Hub</title>
<link href="https://fonts.googleapis.com/css2?family=Mountains+of+Christmas:wght@700&family=Nunito:wght@600;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#0e3b28;--bg2:#082a1c;--red:#b3202a;--red2:#8e1620;--cream:#fff6e5;--gold:#f0c24b;--ink:#2a1a14}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:linear-gradient(rgba(6,28,18,.45),rgba(6,28,18,.8)),url(img/bg.jpg) center/cover no-repeat,radial-gradient(circle at 50% 0,var(--bg),var(--bg2));color:var(--cream);font:800 26px/1.35 Nunito,Arial,sans-serif;overflow-x:hidden}
#snow{position:fixed;inset:0;pointer-events:none;z-index:4}
main{position:relative;z-index:2;max-width:1780px;margin:0 auto;padding:84px 40px 30px}
h1,h2{font-family:"Mountains of Christmas",Georgia,serif;margin:0;color:var(--gold)}
h1{font-size:84px;line-height:1}
h2{font-size:58px}
.view{display:none}.view.on{display:block}
.top{display:flex;align-items:center;gap:24px;margin-bottom:24px}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,button:focus{outline:6px solid var(--gold);outline-offset:4px;transform:scale(1.04)}
.back{background:var(--cream);color:var(--ink);border:0;border-radius:14px;padding:10px 24px}
.cdw{display:flex;gap:.6em;margin-top:.5em}
.cdw div{background:var(--cream);color:var(--red);border-radius:.4em;padding:.3em .7em;text-align:center;min-width:2.6em;font-size:2.6em;line-height:1}
.cdw small{display:block;font-size:.4em;color:var(--ink);margin-top:.2em}
#scene{position:fixed;left:0;top:0;overflow:hidden;z-index:2}
.aur{position:absolute;left:0;right:0;top:0;height:36%;background:linear-gradient(100deg,transparent 10%,rgba(80,255,170,.35) 35%,rgba(140,120,255,.3) 62%,transparent 88%)}
.star{position:absolute;width:.35em;height:.35em;border-radius:50%;background:#fff;opacity:.8}
.hud{position:absolute;left:41%;width:18%;top:7%;text-align:center;z-index:300}
.ttl{font:700 2.6em "Mountains of Christmas",Georgia,serif;color:var(--gold);line-height:1;text-shadow:0 3px 10px #000;white-space:nowrap}
#prompt{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);z-index:400;background:rgba(10,30,20,.85);color:var(--cream);font-size:28px;padding:.25em 1em;border-radius:.8em;white-space:nowrap}
.b{position:absolute;border:0;background:none;padding:0;text-align:center;color:inherit}
.b:focus,.b:focus-visible{outline:0;transform:none}
.roof{width:0;height:0;margin:0 auto;border-left:8.5em solid transparent;border-right:8.5em solid transparent;border-bottom:4.5em solid var(--c)}
.wall{height:8em;background:var(--w);border:.3em solid var(--cream);border-top:0;display:flex;align-items:center;justify-content:center}
.emo{font-size:4.5em;line-height:1}
.sign{display:inline-block;margin-top:.5em;background:var(--cream);color:var(--ink);padding:.1em .8em;border-radius:.5em;font-size:1.7em;line-height:1.3}
.b.near .wall{box-shadow:0 0 0 .5em var(--gold),0 0 3em var(--gold)}
.b.near .sign{background:var(--gold)}
.dec{position:absolute;line-height:1;transform:translate(-50%,-100%)}
.pole{position:absolute;width:2em;height:16em;border-radius:1em;background:repeating-linear-gradient(45deg,#b3202a 0 1em,#fff 1em 2em)}
.pole i{position:absolute;bottom:100%;left:50%;transform:translateX(-50%);margin-bottom:.3em;white-space:nowrap;background:#fff;color:var(--red);font-style:normal;padding:.1em .6em;border-radius:.4em;font-size:1.6em}
#player{position:absolute;font-size:5em;line-height:1;transform:translate(-50%,-100%);transition:left .12s linear,top .12s linear}
#player span{display:block}
.lights{position:fixed;left:0;right:0;top:0;height:22px;z-index:6;pointer-events:none;background:radial-gradient(circle at 12px 11px,#ff5a5a 7px,transparent 8px) 0 0/96px 22px repeat-x,radial-gradient(circle at 12px 11px,#ffd54a 7px,transparent 8px) 32px 0/96px 22px repeat-x,radial-gradient(circle at 12px 11px,#5cff9a 7px,transparent 8px) 64px 0/96px 22px repeat-x;animation:tw 2.4s ease-in-out infinite alternate}
@keyframes tw{from{opacity:.6}to{opacity:1}}
.bar{display:flex;justify-content:space-between;align-items:center;gap:20px}
.logo{font:700 64px "Mountains of Christmas",Georgia,serif;color:var(--gold);text-shadow:0 3px 10px #000}
.clk{font-size:2em;margin-top:.2em;text-shadow:0 2px 8px #000}
#home .cdw{font-size:.7em;margin:.4em 0 0;justify-content:center}
.hm{display:grid;grid-template-columns:500px 1fr;gap:40px;margin-top:14px}
.menu{display:flex;flex-direction:column;gap:10px}
.mi{background:rgba(8,28,20,.6);border:3px solid rgba(255,246,229,.4);border-radius:18px;padding:9px 24px;text-align:left;font-size:30px;display:flex;gap:16px;align-items:center}
.mi b{font-size:38px;font-weight:400}
.mi:focus,.mi:focus-visible{outline:0;background:var(--red);border-color:var(--cream);transform:translateX(12px) scale(1.04);box-shadow:0 0 30px rgba(240,194,75,.7)}
.prev{border:6px solid var(--cream);border-radius:24px;padding:36px;display:flex;flex-direction:column;justify-content:flex-end;min-height:650px;background:#1f6b44 center/cover;box-shadow:0 0 70px var(--t,rgba(0,0,0,.5))}
.pe{font-size:150px;line-height:1}
.prev h3{font:700 78px "Mountains of Christmas",Georgia,serif;margin:0;color:var(--gold);text-shadow:0 3px 12px #000}
.prev p{font-size:32px;margin:6px 0 0;max-width:760px;text-shadow:0 2px 8px #000}
.tick{margin-top:22px;overflow:hidden;white-space:nowrap;background:rgba(5,20,14,.85);border-radius:12px;padding:10px 0}
.tick div{display:inline-block;padding-left:100%;animation:tk 120s linear infinite;font-size:26px}
@keyframes tk{to{transform:translateX(-100%)}}
.orn{position:fixed;top:18px;z-index:6;pointer-events:none;width:2px;transform-origin:top center;animation:sw 3s ease-in-out infinite alternate}
.orn i{display:block;width:2px;background:#e8e2c8}
.orn b{display:block;width:28px;height:28px;margin-left:-13px;border-radius:50%;background:radial-gradient(circle at 30% 30%,rgba(255,255,255,.8),currentColor 60%);box-shadow:inset -6px -6px 10px rgba(0,0,0,.35),0 0 16px currentColor}
@keyframes sw{from{transform:rotate(-7deg)}to{transform:rotate(7deg)}}
#sleigh{position:fixed;top:9%;left:-25%;font-size:64px;white-space:nowrap;z-index:3;pointer-events:none;filter:drop-shadow(0 0 14px #fff9);animation:fly 50s linear infinite 5s}
@keyframes fly{0%{transform:translate(0,0)}15%{transform:translate(35vw,-34px)}30%{transform:translate(70vw,18px)}60%{transform:translate(150vw,-12px)}100%{transform:translate(150vw,-12px)}}
.shoot{position:fixed;top:14%;left:8%;width:200px;height:3px;background:linear-gradient(90deg,transparent,#fff);opacity:0;z-index:0;pointer-events:none;animation:sh 13s ease-out infinite}
@keyframes sh{0%{opacity:0;transform:translate(0,0) rotate(25deg)}2%{opacity:1}9%{opacity:0;transform:translate(700px,330px) rotate(25deg)}100%{opacity:0}}
#bg path[filter]{animation:au 14s ease-in-out infinite alternate}
@keyframes au{from{transform:translateX(-90px) scaleY(.9)}to{transform:translateX(90px) scaleY(1.2)}}
#tint{position:fixed;inset:0;z-index:0;pointer-events:none;background:radial-gradient(circle at 72% 55%,var(--t,transparent),transparent 65%);transition:background 1s}
.logo{animation:gl 3s ease-in-out infinite alternate}
@keyframes gl{from{text-shadow:0 3px 10px #000,0 0 10px rgba(240,194,75,.3)}to{text-shadow:0 3px 10px #000,0 0 44px #f0c24b}}
.prev{position:relative;overflow:hidden}
.fx{position:absolute;inset:0;pointer-events:none}
.fx span{position:absolute;bottom:-70px;opacity:0;animation:rise 6s linear infinite}
@keyframes rise{0%{transform:translateY(0) rotate(0);opacity:0}12%{opacity:.9}100%{transform:translateY(-700px) rotate(40deg);opacity:0}}
.pe,.prev h3,.prev p{position:relative;z-index:1}
#gnd{position:absolute;left:0;right:0;top:36%;bottom:0;background:linear-gradient(#f4f9fd,#d6e7f4 25%,#b9d3e8)}
.b{transition:transform .15s}.b.near svg{filter:drop-shadow(0 0 1.2em #ffd24a);transform:scale(1.05);transform-origin:50% 100%}
.lt{animation:tw2 1.4s ease-in-out infinite alternate}@keyframes tw2{from{opacity:.3}to{opacity:1}}
.wn{animation:fl 3s ease-in-out infinite alternate}@keyframes fl{from{opacity:.7}to{opacity:1}}
.sm{transform-box:fill-box;transform-origin:center;animation:smk 4s ease-out infinite}.s2{animation-delay:2s}
@keyframes smk{0%{transform:translate(0,0) scale(.6);opacity:.8}100%{transform:translate(14px,-40px) scale(2);opacity:0}}
.st{animation:stp 1.6s ease-in-out infinite alternate}@keyframes stp{from{filter:drop-shadow(0 0 2px #ffd54a)}to{filter:drop-shadow(0 0 12px #fff3a0)}}
.wander{animation:wd 7s ease-in-out infinite alternate}@keyframes wd{from{transform:translate(-50%,-100%)}to{transform:translate(calc(-50% + 7em),-100%)}}
.spin{transform-box:fill-box;transform-origin:center;animation:spn 6s linear infinite}@keyframes spn{to{transform:rotate(360deg)}}
#pad,#padok{display:none}
@media (pointer:coarse){#prompt{bottom:178px;font-size:20px}
#pad{display:grid;position:fixed;left:14px;bottom:14px;grid-template:repeat(3,56px)/repeat(3,56px);gap:6px;z-index:400}
#pad button,#padok{background:rgba(10,30,20,.7);border:3px solid var(--cream);border-radius:16px;color:var(--cream);font-size:26px;touch-action:none}
#padok{display:block;position:fixed;right:18px;bottom:40px;width:96px;height:96px;border-radius:50%;z-index:400;background:rgba(179,32,42,.9)}}
.tiles{display:grid;grid-template-columns:repeat(4,1fr);gap:24px}
.tile{border:6px solid var(--cream);border-radius:22px;padding:30px 10px;font-size:30px;background:var(--red);box-shadow:inset 0 0 0 6px rgba(255,255,255,.12)}
.tile:nth-child(even){background:#1f6b44}
.tile span{display:block;font-size:76px;line-height:1.1}
.row{display:grid;grid-template-columns:420px 1fr;gap:30px}
.list{display:flex;flex-direction:column;gap:12px}
.item{background:var(--red);border:4px solid var(--cream);border-radius:14px;padding:12px 18px;text-align:left}
.panel{background:var(--cream);color:var(--ink);border-radius:20px;padding:28px 34px;min-height:380px}
.panel h3{font-family:"Mountains of Christmas",Georgia,serif;font-size:46px;margin:0 0 8px;color:var(--red)}
.panel p{margin:8px 0;font-weight:600}
.frame{width:100%;aspect-ratio:16/9;border:6px solid var(--cream);border-radius:18px;background:#000}
.note{background:var(--cream);color:var(--ink);padding:20px;border-radius:14px}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-top:20px}
.opt{background:var(--red);border:4px solid var(--cream);border-radius:14px;padding:16px}
.opt.ok{background:#1f8f4f}.opt.bad{background:#555}
.grid{display:grid;gap:14px}
.card{height:130px;font-size:64px;background:var(--red);border:4px solid var(--cream);border-radius:14px}
.card.up{background:var(--cream)}
.sq{height:150px;font-size:80px;background:#0b2f20;border:4px solid var(--cream);border-radius:14px}
.big{font-size:34px}
</style>
</head>
<body>
<canvas id="snow"></canvas>
<div class="lights"></div>
<div id="sleigh">🦌🦌🦌🛷</div><div class="shoot"></div><div class="shoot" style="top:6%;left:48%;animation-delay:6s"></div>
<svg id="bg" viewBox="0 0 1920 1080" preserveAspectRatio="xMidYMid slice" style="position:fixed;left:0;top:0;width:100%;height:100%;z-index:0">
<defs><linearGradient id="sk" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#050d24"/><stop offset=".55" stop-color="#17386a"/><stop offset="1" stop-color="#4a7fa8"/></linearGradient>
<linearGradient id="au" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#3cff9a" stop-opacity="0"/><stop offset=".4" stop-color="#3cff9a" stop-opacity=".55"/><stop offset=".7" stop-color="#9a7cff" stop-opacity=".45"/><stop offset="1" stop-color="#9a7cff" stop-opacity="0"/></linearGradient>
<radialGradient id="mn"><stop offset="0" stop-color="#fffbe8"/><stop offset=".35" stop-color="#fffbe8"/><stop offset="1" stop-color="#fffbe8" stop-opacity="0"/></radialGradient>
<filter id="bl"><feGaussianBlur stdDeviation="28"/></filter></defs>
<rect width="1920" height="1080" fill="url(#sk)"/><g id="stars"></g>
<path d="M0 330 Q480 120 960 260 T1920 200 L1920 420 Q1400 330 960 430 T0 470Z" fill="url(#au)" filter="url(#bl)"/>
<circle cx="1620" cy="190" r="150" fill="url(#mn)" opacity=".5"/><circle cx="1620" cy="190" r="62" fill="#fffbe8"/>
<path d="M0 760 Q300 680 600 740 T1200 730 T1920 720 V1080 H0Z" fill="#8fb4d3"/><g id="t1"></g>
<path d="M0 850 Q400 770 900 840 T1920 810 V1080 H0Z" fill="#d6e8f5"/><g id="t2"></g>
<path d="M0 960 Q500 905 1000 965 T1920 935 V1080 H0Z" fill="#c9deef"/></svg><div id="tint"></div>
<main>

<section class="view on" id="home">
<div id="scene"><div id="gnd"></div>
    
    <div class="hud"><div class="ttl">🎄 North Pole</div><div class="cdw"></div><div class="clk" id="clk"></div></div>
    <div id="player"><span>🧝</span></div>
  </div>
<div id="prompt">Use the arrow keys to walk around</div>
<div id="pad"><button data-k="ArrowUp" style="grid-area:1/2">▲</button><button data-k="ArrowLeft" style="grid-area:2/1">◀</button><button data-k="ArrowRight" style="grid-area:2/3">▶</button><button data-k="ArrowDown" style="grid-area:3/2">▼</button></div><button id="padok">OK</button>
</section>

<section class="view" id="yule">
  <div class="top"><button class="back" data-go="home">⬅ Home</button><h2>Yule Log</h2></div>
  <div id="yuleBox"></div>
</section>

<section class="view" id="music">
  <div class="top"><button class="back" data-go="home">⬅ Home</button><h2>Christmas Music</h2></div>
  <div id="musicBox"></div>
</section>

<section class="view" id="movies">
  <div class="top"><button class="back" data-go="home">⬅ Home</button><h2>Movie Night</h2></div>
  <div class="row"><div class="list" id="movieList"></div><div class="panel" id="moviePanel"></div></div>
</section>

<section class="view" id="recipes">
  <div class="top"><button class="back" data-go="home">⬅ Home</button><h2>Holiday Recipes</h2></div>
  <div class="row"><div class="list" id="recipeList"></div><div class="panel" id="recipePanel"></div></div>
</section>

<section class="view" id="games">
  <div class="top"><button class="back" id="gback">⬅ Back</button><h2>Games</h2></div>
  <div class="tiles" id="gmenu">
    <button class="tile" data-game="trivia"><span>🧠</span>Trivia</button>
    <button class="tile" data-game="scramble"><span>🔤</span>Word Scramble</button>
    <button class="tile" data-game="memory"><span>🃏</span>Memory Match</button>
    <button class="tile" data-game="color"><span>🎨</span>Color the Tree</button>
    <button class="tile" data-game="catch"><span>🎁</span>Catch the Gifts</button>
  </div>
  <div id="stage" style="display:none"></div>
</section>

<section class="view" id="quiz">
  <div class="top"><button class="back" data-go="home">⬅ Home</button><h2>Naughty or Nice?</h2></div>
  <div id="quizBox"></div>
</section>

<section class="view" id="facts">
  <div class="top"><button class="back" data-go="home">⬅ Home</button><h2>Fun Facts</h2></div>
  <div class="panel"><p class="big" id="factText"></p></div>
  <p><button class="tile" id="nextFact" style="padding:16px 40px">Next fact ➜</button></p>
</section>

</main>

<script>
/* ===== CONFIG: paste YouTube IDs here (the part after v= or list=) ===== */
const CONFIG = {
  yuleVideoId: "",      // e.g. a fireplace / yule log video ID
  musicPlaylistId: ""   // a Christmas music playlist ID (starts with PL...)
};

const $ = s => document.querySelector(s);
const $$ = s => [...document.querySelectorAll(s)];
const shuffle = a => { a = [...a]; for (let i = a.length - 1; i > 0; i--) { const j = Math.random() * (i + 1) | 0; [a[i], a[j]] = [a[j], a[i]]; } return a; };

/* ===== Views / navigation ===== */
let current = 'home';
function show(id) {
  if (id === 'snowtoggle') { snowOn = !snowOn; return; }
  $$('.view').forEach(v => v.classList.toggle('on', v.id === id));
  current = id;
  if (id === 'yule') embed('#yuleBox', CONFIG.yuleVideoId && `https://www.youtube.com/embed/${CONFIG.yuleVideoId}?rel=0&autoplay=0`, 'a Yule Log video ID (yuleVideoId)');
  if (id === 'music') embed('#musicBox', CONFIG.musicPlaylistId && `https://www.youtube.com/embed/videoseries?list=${CONFIG.musicPlaylistId}&rel=0`, 'a playlist ID (musicPlaylistId)');
  if (id === 'quiz') startQuiz();
  if (id === 'facts') nextFact();
  if (id !== 'yule' && id !== 'music') { $('#yuleBox').innerHTML = ''; $('#musicBox').innerHTML = ''; }
  if (id !== 'games') closeStage(true);
  window.scrollTo(0, 0);
  if (id === 'home') { document.activeElement && document.activeElement.blur(); sizeScene(); updNear(); return; }
  const pick = document.querySelector('.view.on .mi, .view.on .item, .view.on .tile, .view.on button');
  pick && pick.focus();
}
function embed(sel, url, what) {
  $(sel).innerHTML = url
    ? `<iframe class="frame" src="${url}" allow="autoplay; encrypted-media; fullscreen" allowfullscreen></iframe><p>Press OK on the video to play. Needs internet.</p>`
    : `<div class="note">Add ${what} to CONFIG at the top of index.html.</div>`;
}
function back() {
  if (current === 'games' && $('#stage').style.display !== 'none') { closeStage(); return; }
  show('home');
}
document.addEventListener('click', e => {
  const b = e.target.closest('button'); if (!b) return;
  if (b.dataset.go) show(b.dataset.go);
  else if (b.dataset.game) startGame(b.dataset.game);
  else if (b.id === 'gback') back();
  else if (b.id === 'nextFact') nextFact();
});
document.addEventListener('keydown', e => {
  if (current === 'home') {
    if (e.key.startsWith('Arrow')) { e.preventDefault(); move(e.key); return; }
    if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); nearB && show(nearB.dataset.go); return; }
  }
  if (e.key === 'Escape' || e.key === 'Backspace' || e.keyCode === 10009 || e.keyCode === 461) { e.preventDefault(); back(); return; }
  if (!e.key.startsWith('Arrow')) return;
  if (document.activeElement && document.activeElement.tagName === 'IFRAME') return;
  e.preventDefault();
  const els = $$('.view.on button').filter(b => b.offsetParent);
  const cur = document.activeElement;
  if (!els.includes(cur)) { els[0] && els[0].focus(); return; }
  const r = cur.getBoundingClientRect(), cx = r.left + r.width / 2, cy = r.top + r.height / 2;
  let best, bs = 1e9;
  els.forEach(b => {
    if (b === cur) return;
    const q = b.getBoundingClientRect(), x = q.left + q.width / 2 - cx, y = q.top + q.height / 2 - cy;
    const [m, o] = e.key === 'ArrowRight' ? [x, Math.abs(y)] : e.key === 'ArrowLeft' ? [-x, Math.abs(y)] : e.key === 'ArrowDown' ? [y, Math.abs(x)] : [-y, Math.abs(x)];
    if (m <= 4) return;
    const s = m + o * 2; if (s < bs) { bs = s; best = b; }
  });
  best && best.focus();
});

/* ===== Countdown ===== */
const setCd = h => $$('.cdw').forEach(e => e.innerHTML = h);
function tick() {
  const n = new Date();
  $('#clk').textContent = n.toLocaleTimeString([], { hour: 'numeric', minute: '2-digit' }); let t = new Date(n.getFullYear(), 11, 25);
  if (n.getMonth() === 11 && n.getDate() === 25) { setCd('<div style="background:none;color:var(--gold)">🎄 It’s Christmas Day! 🎅</div>'); return; }
  if (n > t) t = new Date(n.getFullYear() + 1, 11, 25);
  let d = Math.floor((t - n) / 1000);
  const days = Math.floor(d / 86400), h = Math.floor(d % 86400 / 3600), m = Math.floor(d % 3600 / 60), s = d % 60;
  setCd([[days, 'days'], [h, 'hours'], [m, 'mins'], [s, 'secs']].map(x => `<div>${x[0]}<small>${x[1]}</small></div>`).join(''));
}
tick(); setInterval(tick, 1000);

/* ===== Snow ===== */
let snowOn = true;
const cv = $('#snow'), cx = cv.getContext('2d');
let flakes = [];
function sizeSnow() { cv.width = innerWidth; cv.height = innerHeight; flakes = Array.from({ length: 110 }, () => ({ x: Math.random() * cv.width, y: Math.random() * cv.height, r: 2 + Math.random() * 4, v: 0.6 + Math.random() * 1.6, p: Math.random() * 6 })); }
sizeSnow(); addEventListener('resize', sizeSnow);
(function loop() {
  cx.clearRect(0, 0, cv.width, cv.height);
  if (snowOn) {
    cx.fillStyle = 'rgba(255,255,255,.85)';
    flakes.forEach(f => { f.y += f.v; f.p += .02; f.x += Math.sin(f.p); if (f.y > cv.height) { f.y = -5; f.x = Math.random() * cv.width; } cx.beginPath(); cx.arc(f.x, f.y, f.r, 0, 7); cx.fill(); });
  }
  requestAnimationFrame(loop);
})();

/* ===== List + detail (movies, recipes) ===== */
function listDetail(listSel, panelSel, data, render) {
  $(listSel).innerHTML = data.map((d, i) => `<button class="item" data-i="${i}">${d[0]}</button>`).join('');
  const upd = i => $(panelSel).innerHTML = render(data[i]);
  $$(listSel + ' .item').forEach(b => b.addEventListener('focus', () => upd(+b.dataset.i)));
  upd(0);
}

let timer = null;
function closeStage(silent) {
  clearInterval(timer); timer = null;
  $('#stage').style.display = 'none'; $('#stage').innerHTML = '';
  $('#gmenu').style.display = '';
  if (!silent) { const t = $('#gmenu .tile'); t && t.focus(); }
}
function startGame(g) {
  $('#gmenu').style.display = 'none'; $('#stage').style.display = '';
  ({ trivia, scramble, memory, color, catchGame })[g]();
  const b = $('#stage button'); b && b.focus();
}
function quizLoop(items, title, render, onEnd) {
  let i = 0, score = 0;
  const go = () => {
    if (i >= items.length) { $('#stage').innerHTML = `<div class="panel"><h3>${onEnd(score, items.length)}</h3></div><p><button class="tile" id="again" style="padding:16px 40px">Play again</button></p>`; $('#again').onclick = () => startGame(title); $('#again').focus(); return; }
    const [html, opts, correct] = render(items[i]);
    $('#stage').innerHTML = `<div class="panel"><p class="big">${html}</p></div><div class="opts">${opts.map((o, k) => `<button class="opt" data-k="${k}">${o}</button>`).join('')}</div>`;
    $$('#stage .opt').forEach(b => b.onclick = () => {
      const ok = +b.dataset.k === correct; if (ok) score++;
      $$('#stage .opt').forEach(x => { x.disabled = true; if (+x.dataset.k === correct) x.classList.add('ok'); });
      if (!ok) b.classList.add('bad');
      setTimeout(() => { i++; go(); }, 900);
    });
    $('#stage .opt').focus();
  };
  go();
}
function trivia() {
  const Q = [
    ['Which reindeer has a red nose?', ['Dasher', 'Rudolph', 'Comet', 'Blitzen'], 1],
    ['What do kids leave out for Santa?', ['Pizza', 'Cookies and milk', 'Soup', 'Salad'], 1],
    ['Where does Santa live?', ['South Pole', 'Hawaii', 'North Pole', 'Paris'], 2],
    ['How many gifts in total in “12 Days of Christmas”?', ['78', '12', '100', '364'], 0],
    ['Which country started the Christmas tree tradition?', ['Germany', 'Brazil', 'Japan', 'Egypt'], 0],
    ['What plant do people kiss under at Christmas?', ['Holly', 'Mistletoe', 'Ivy', 'Fern'], 1],
    ['What color are Santa’s boots?', ['Red', 'Green', 'Black', 'Gold'], 2],
    ['Who stole Christmas?', ['The Grinch', 'Scrooge', 'Jack Frost', 'The Elf'], 0]
  ];
  quizLoop(shuffle(Q).slice(0, 6), 'trivia', q => [q[0], q[1], q[2]], (s, n) => `You got ${s} of ${n}! ${s >= n - 1 ? '🏆 Santa’s helper!' : '🎄 Good try!'}`);
}
function scramble() {
  const W = ['REINDEER', 'SNOWMAN', 'STOCKING', 'TINSEL', 'MISTLETOE', 'CANDYCANE', 'SLEIGH', 'PRESENTS', 'SANTA', 'ORNAMENT'];
  const sc = w => { let s; do s = shuffle(w.split('')).join(''); while (s === w); return s; };
  quizLoop(shuffle(W).slice(0, 6), 'scramble', w => {
    const opts = shuffle([w, ...shuffle(W.filter(x => x !== w)).slice(0, 3)]);
    return [`Unscramble: <b style="color:var(--red)">${sc(w)}</b>`, opts, opts.indexOf(w)];
  }, (s, n) => `${s} of ${n} unscrambled! ${s >= n - 1 ? '🏆' : '🎄'}`);
}
function memory() {
  const E = ['🎅', '🎄', '⛄', '🎁', '🔔', '🦌'];
  const deck = shuffle([...E, ...E]); let open = [], lock = false, found = 0, moves = 0;
  $('#stage').innerHTML = `<p id="mv" class="big">Moves: 0</p><div class="grid" style="grid-template-columns:repeat(4,1fr)">${deck.map((e, i) => `<button class="card" data-i="${i}">❓</button>`).join('')}</div>`;
  $$('#stage .card').forEach(b => b.onclick = () => {
    if (lock || b.classList.contains('up')) return;
    b.classList.add('up'); b.textContent = deck[b.dataset.i]; open.push(b);
    if (open.length === 2) {
      moves++; $('#mv').textContent = 'Moves: ' + moves;
      const [a, c] = open;
      if (a.textContent === c.textContent) { found++; open = []; if (found === 6) $('#mv').textContent = `🎉 You won in ${moves} moves! Press Back to play more.`; }
      else { lock = true; setTimeout(() => { open.forEach(x => { x.classList.remove('up'); x.textContent = '❓'; }); open = []; lock = false; }, 800); }
    }
  });
}

function catchGame() {

  sq.forEach(b => b.onclick = () => { if (+b.dataset.i === on) { score++; on = -1; b.textContent = ''; hud(); } });
  const hud = () => $('#hud').textContent = `Score: ${score} | Time: ${left}`;
  let n = 0;

    n++;

    sq.forEach(b => b.textContent = '');

    hud();
    if (left <= 0) { clearInterval(timer); sq.forEach(b => b.textContent = ''); $('#hud').textContent = `🎉 Final score: ${score}! Press Back to play more.`; }

}
